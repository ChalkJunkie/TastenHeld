<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Ein Wuschelmonster">
  <!-- Wuschelmonster (selbst gezeichnet): eher frech als gruselig -->
  <!-- Hörner -->
  <path d="M58 52 Q44 20 64 14 Q66 34 78 44 Z" fill="#ffe8a3" stroke="#2b3a67" stroke-width="4" stroke-linejoin="round"/>
  <path d="M142 52 Q156 20 136 14 Q134 34 122 44 Z" fill="#ffe8a3" stroke="#2b3a67" stroke-width="4" stroke-linejoin="round"/>
  <!-- Wuschelkörper -->
  <path d="M40 120 Q26 104 38 90 Q30 70 50 62 Q52 42 74 44 Q86 30 100 40 Q116 30 128 44 Q150 42 150 62 Q170 70 162 90 Q174 104 160 120 Q168 140 154 154 Q156 176 132 176 Q118 190 100 180 Q82 190 68 176 Q44 176 46 154 Q32 140 40 120 Z"
        fill="#8b6bd9" stroke="#2b3a67" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bauch -->
  <ellipse cx="100" cy="140" rx="36" ry="28" fill="#b9a2f0"/>
  <!-- Augenbrauen (grummelig) -->
  <path d="M60 72 L88 82" stroke="#2b3a67" stroke-width="6" stroke-linecap="round"/>
  <path d="M140 72 L112 82" stroke="#2b3a67" stroke-width="6" stroke-linecap="round"/>
  <!-- Augen -->
  <circle cx="76" cy="96" r="15" fill="#fff" stroke="#2b3a67" stroke-width="4"/>
  <circle cx="124" cy="96" r="15" fill="#fff" stroke="#2b3a67" stroke-width="4"/>
  <circle cx="80" cy="99" r="6" fill="#2b3a67"/>
  <circle cx="120" cy="99" r="6" fill="#2b3a67"/>
  <!-- Mund mit Zähnchen -->
  <path d="M74 124 Q100 112 126 124" fill="none" stroke="#2b3a67" stroke-width="5" stroke-linecap="round"/>
  <path d="M84 120 L88 129 L92 118 Z" fill="#fff" stroke="#2b3a67" stroke-width="2"/>
  <path d="M108 118 L112 129 L116 120 Z" fill="#fff" stroke="#2b3a67" stroke-width="2"/>
  <!-- Füße -->
  <ellipse cx="74" cy="184" rx="18" ry="9" fill="#6a4fc0" stroke="#2b3a67" stroke-width="4"/>
  <ellipse cx="126" cy="184" rx="18" ry="9" fill="#6a4fc0" stroke="#2b3a67" stroke-width="4"/>
</svg>
