<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Tipp, der kleine Roboter">
  <!-- Tipp, der kleine Roboter (selbst gezeichnet) -->
  <!-- Antenne -->
  <line x1="100" y1="34" x2="100" y2="14" stroke="#2b3a67" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="12" r="9" fill="#ffcf4a" stroke="#2b3a67" stroke-width="4"/>
  <!-- Ohren -->
  <rect x="30" y="58" width="16" height="30" rx="6" fill="#ff8a5c" stroke="#2b3a67" stroke-width="4"/>
  <rect x="154" y="58" width="16" height="30" rx="6" fill="#ff8a5c" stroke="#2b3a67" stroke-width="4"/>
  <!-- Kopf -->
  <rect x="42" y="32" width="116" height="84" rx="26" fill="#5cc3f0" stroke="#2b3a67" stroke-width="5"/>
  <!-- Bildschirm-Gesicht -->
  <rect x="56" y="46" width="88" height="56" rx="16" fill="#1f2b4f"/>
  <ellipse cx="82" cy="70" rx="9" ry="11" fill="#7ff3c4"/>
  <ellipse cx="118" cy="70" rx="9" ry="11" fill="#7ff3c4"/>
  <circle cx="85" cy="66" r="3" fill="#fff"/>
  <circle cx="121" cy="66" r="3" fill="#fff"/>
  <path d="M86 88 Q100 98 114 88" fill="none" stroke="#7ff3c4" stroke-width="5" stroke-linecap="round"/>
  <circle cx="66" cy="88" r="5" fill="#ff8fb1" opacity=".8"/>
  <circle cx="134" cy="88" r="5" fill="#ff8fb1" opacity=".8"/>
  <!-- Hals -->
  <rect x="88" y="114" width="24" height="10" fill="#2b3a67"/>
  <!-- Arme -->
  <path d="M52 140 Q30 150 28 172" fill="none" stroke="#2b3a67" stroke-width="9" stroke-linecap="round"/>
  <path d="M148 140 Q170 150 172 172" fill="none" stroke="#2b3a67" stroke-width="9" stroke-linecap="round"/>
  <circle cx="28" cy="174" r="9" fill="#ffcf4a" stroke="#2b3a67" stroke-width="4"/>
  <circle cx="172" cy="174" r="9" fill="#ffcf4a" stroke="#2b3a67" stroke-width="4"/>
  <!-- Körper -->
  <rect x="50" y="122" width="100" height="64" rx="20" fill="#ff8a5c" stroke="#2b3a67" stroke-width="5"/>
  <!-- Tasten auf dem Bauch -->
  <g fill="#fff" stroke="#2b3a67" stroke-width="2.5">
    <rect x="64" y="136" width="18" height="16" rx="4"/>
    <rect x="91" y="136" width="18" height="16" rx="4"/>
    <rect x="118" y="136" width="18" height="16" rx="4"/>
    <rect x="72" y="158" width="56" height="14" rx="4"/>
  </g>
  <rect x="94.5" y="139.5" width="11" height="9" rx="2" fill="#ffcf4a" stroke="none"/>
  <!-- Füße -->
  <rect x="62" y="184" width="28" height="12" rx="6" fill="#2b3a67"/>
  <rect x="110" y="184" width="28" height="12" rx="6" fill="#2b3a67"/>
